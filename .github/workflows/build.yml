name: build

# Dua pekerjaan yang sengaja dipisah.
#
# `check` cepat dan jalan di setiap dorongan: dia cuma menanyakan satu hal —
# apakah proyeknya masih bisa dibuka dan seluruh skripnya masih terurai. Itu
# kesalahan yang paling sering terjadi dan paling mahal kalau baru ketahuan
# saat mau build.
#
# Platform exports are heavier, so they run only for version tags and manual
# validation. They produce artifacts, not GitHub releases.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  check:
    name: parse & import
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ambil Godot
        run: |
          curl -sL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Impor aset
        # Impor pertama selalu melaporkan "resource not found" untuk berkas yang
        # belum sempat dibuat saat berkas lain memuatnya. Jalan dua kali
        # menyelesaikannya, dan itu memang cara yang dianjurkan Godot.
        run: |
          "$GODOT" --headless --import --path . || true
          "$GODOT" --headless --import --path .

      - name: Periksa skrip terurai
        run: |
          out=$("$GODOT" --headless --quit-after 120 --path . 2>&1) || true
          echo "$out"
          # "resources still in use at exit" itu peringatan saat menutup, bukan
          # kesalahan proyek — muncul karena pemutar audio masih memegang
          # streamnya waktu pohon node dibongkar.
          if echo "$out" | grep -E "SCRIPT ERROR|Parse Error|Compile Error"; then
            echo "::error::ada skrip yang gagal terurai"
            exit 1
          fi

      - name: Periksa penempatan spell
        # Blok, bukan satu baris: nilai `run:` yang diawali tanda kutip akan
        # dibaca YAML sebagai string yang berhenti di kutip penutup, dan sisa
        # perintahnya jadi sampah yang tidak bisa diurai.
        run: |
          "$GODOT" --headless --path . --script res://tools/probe_launch.gd

      - name: Periksa alur gameplay
        run: |
          "$GODOT" --headless --path . --script res://tools/test_gameplay.gd

  build:
    name: macOS app
    needs: check
    # The export is heavier and only useful for release candidates. Normal
    # pushes still run the fast checks above; build manually when needed.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ambil Godot
        run: |
          curl -sL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Cache export template
        id: tpl
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Ambil export template
        if: steps.tpl.outputs.cache-hit != 'true'
        run: |
          curl -sL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          DEST="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          mv templates/* "$DEST/"

      - name: Impor aset
        run: |
          "$GODOT" --headless --import --path . || true
          "$GODOT" --headless --import --path .

      - name: Ekspor
        run: |
          mkdir -p build
          "$GODOT" --headless --path . \
            --export-release "macOS" "$PWD/build/Amalgaform.app"

      - name: Tanda tangan ad-hoc
        # Runner tidak punya Developer ID milik Xaviero, dan kunci pribadi tidak
        # akan ditaruh di sini. Jadi hasil CI ini untuk memeriksa bahwa build-nya
        # TIDAK RUSAK, bukan untuk dibagikan — kalau dibuka di Mac lain,
        # Gatekeeper menolaknya dengan "Apple could not verify...". Itu perilaku
        # yang benar, bukan kerusakan. Rilis yang dibagi ke orang lain dibuat di
        # mesin sendiri lewat `NOTARIZE=1 ./scripts/build_mac.sh`.
        run: |
          xattr -cr build/Amalgaform.app
          codesign --force --deep --sign - build/Amalgaform.app
          codesign --verify --deep --strict build/Amalgaform.app

      - name: Bungkus
        run: |
          # Catatan ikut masuk ke dalam paket. Nama artifact saja tidak cukup:
          # GitHub membungkus ulang unduhan jadi zip bersarang, dan nama luarnya
          # hilang begitu orang mengekstrak yang pertama.
          cat > build/BACA-DULU.txt <<'CATATAN'
          Build ini dari CI, dan SENGAJA TIDAK DINOTARISASI.

          Dia hanya ditandatangani ad-hoc, jadi kalau dibuka di Mac lain macOS
          akan menolaknya:

              "Apple could not verify Amalgaform is free of malware"

          Itu perilaku yang benar, bukan build yang rusak. Gunanya build ini
          cuma satu: membuktikan bahwa proyeknya masih bisa diekspor.

          Yang dibagikan ke orang lain dibuat di mesin sendiri:

              NOTARIZE=1 ./scripts/build_mac.sh

          Hasilnya di ~/Builds/Amalgaform.zip, dan itu bisa dibuka dengan
          klik ganda biasa di Mac mana pun.
          CATATAN
          ditto -c -k --keepParent build/Amalgaform.app build/Amalgaform.zip

      - uses: actions/upload-artifact@v4
        with:
          # Namanya menyebut statusnya. Artifact ini sudah pernah membingungkan
          # sekali; nama netral seperti "Amalgaform-macOS" terbaca seperti rilis.
          name: Amalgaform-macOS-UNSIGNED-ci-check-only
          path: |
            build/Amalgaform.zip
            build/BACA-DULU.txt
          retention-days: 14

  windows:
    name: Windows x86_64
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        shell: pwsh
        run: |
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable"
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          $godotPath = Join-Path (Resolve-Path godot).Path "Godot_v$env:GODOT_VERSION-stable_win64.exe"
          Add-Content $env:GITHUB_ENV "GODOT=$godotPath"

      - name: Cache export templates
        id: tpl
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\godot-export-templates\${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download export templates
        if: steps.tpl.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable"
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_export_templates.tpz" -OutFile templates.zip
          Expand-Archive templates.zip -DestinationPath templates
          $dest = Join-Path $env:RUNNER_TEMP "godot-export-templates/$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item templates/templates/* $dest -Recurse -Force

      - name: Install export templates
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "godot-export-templates/$env:GODOT_VERSION.stable"
          $dest = Join-Path $env:APPDATA "Godot/export_templates/$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$source/*" $dest -Recurse -Force

      - name: Import assets
        shell: pwsh
        run: |
          & $env:GODOT --headless --import --path .
          & $env:GODOT --headless --import --path .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & $env:GODOT --headless --path . --export-release "Windows Desktop" "$PWD/build/Amalgaform.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build/Amalgaform.exe -DestinationPath build/Amalgaform-Windows.zip -Force

      - name: Smoke test exported Windows game
        shell: pwsh
        run: |
          $game = (Resolve-Path build/Amalgaform.exe).Path
          $process = Start-Process -FilePath $game -ArgumentList @('--headless', '--quit-after', '60') -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput build/windows-smoke-out.txt -RedirectStandardError build/windows-smoke-err.txt
          Get-Content build/windows-smoke-out.txt
          Get-Content build/windows-smoke-err.txt
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $output = (Get-Content build/windows-smoke-out.txt -Raw) + (Get-Content build/windows-smoke-err.txt -Raw)
          if ($output -match 'SCRIPT ERROR|Parse Error|Compile Error|Error loading extension|No GDExtension library found') { throw 'Exported game reported a load or script error' }

      - uses: actions/upload-artifact@v4
        with:
          name: Amalgaform-Windows
          path: build/Amalgaform-Windows.zip
          retention-days: 14
